<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Printastic JA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:#111;font:15px/1.4 system-ui,sans-serif;min-height:100vh}
.page{max-width:380px;margin:0 auto;padding:20px 16px 40px}
.bar{display:flex;gap:10px;margin:0 0 16px}
.bar button{flex:1;font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 10px;cursor:pointer;background:#111;color:#fff}
.bar button.alt{background:#fff;color:#111;border:1px solid #d6d6d6}
.slip{position:relative;width:100%;background:#fff;color:#111;padding:24px 20px 32px;font:13px/1.45 'DM Mono',ui-monospace,Menlo,monospace;box-shadow:0 2px 14px rgba(0,0,0,.08);margin-bottom:10px}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 8px,linear-gradient(225deg,#fff 50%,transparent 50%) 0 0/12px 8px}
.lg{display:block;margin:0 auto 6px;width:130px;height:auto}
.dt{text-align:center;font-size:11.5px;color:#444;margin-bottom:3px}
.rbox{position:relative;border:1.5px dashed #555;border-radius:10px;padding:16px 8px 12px;margin:18px 0;text-align:center}
.rbox i{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#fff;padding:0 8px;font-style:normal;font-size:11.5px;font-weight:500;white-space:nowrap}
.rbox b{font-weight:500;font-size:21px;letter-spacing:.06em}
.rw{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.rw span{color:#8a8a8a}
.rw b{font-weight:500;color:#111;text-align:right;white-space:nowrap;flex-shrink:0}
.rw.big span,.rw.big b{font-size:15px;color:#111}
.rw.red span,.rw.red b{color:#c62828}
.rw.green span,.rw.green b{color:#1b8a3a}
.rw.sub span{padding-left:8px;font-size:12px}
.rw.sub b{font-size:12px;color:#8a8a8a}
.sp{border:0;border-top:1px dashed #bbb;margin:12px 0}
.brand{text-align:center;font:italic 800 28px/1 'Bricolage Grotesque',sans-serif;margin:20px 0 8px;text-transform:uppercase}
.ft{text-align:center;font-size:11.5px;color:#555;padding:1px 0}
.ft.gap{margin-top:14px}
.err{background:#fff;border-radius:12px;padding:24px;text-align:center}
.note{text-align:center;color:#777;font-size:12.5px;margin-top:22px}
@media print{
  @page{margin:10mm}
  body{background:#fff}
  .bar,.note{display:none}
  .page{max-width:none;padding:0}
  .slip{box-shadow:none;max-width:380px;margin:0 auto;padding:14px 18px 22px;font-size:11.5px;page-break-inside:avoid;break-inside:avoid}
  .lg{width:96px;margin-bottom:2px}
  .rw{padding:2px 0}
  .sp{margin:7px 0}
  .rbox{margin:12px 0;padding:12px 8px 9px}
  .brand{margin:12px 0 6px;font-size:24px}
  .slip::after{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="page">
  <div class="bar" id="bar" hidden>
    <button id="pdf">Download PDF</button>
    <button class="alt" id="prt">Print</button>
  </div>
  <div id="out"></div>
  <p class="note" id="hint" hidden>Tip: in the window that opens, choose “Save as PDF”.</p>
</div>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function n2(n){return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fromB64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decode(h){
  h=(h||'').replace(/^#/,'');
  var kind=h.slice(0,2),body=h.slice(2),bytes=fromB64u(body);
  if(kind==='z.'){
    var ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(bytes);w.close();
    bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }else if(kind!=='j.')throw new Error('bad');
  return JSON.parse(new TextDecoder().decode(bytes));
}
function row(l,r,c){return '<div class="rw'+(c||'')+'"><span>'+esc(l)+'</span><b>'+esc(r)+'</b></div>'}
function render(o){
  var inv=o.k==='inv',h='<div class="slip"><img class="lg" alt="" src="'+LOGO+'">';
  if(o.wa)h+='<div class="dt">WhatsApp '+esc(o.wa)+'</div>';
  h+='<div class="dt">'+esc(o.dt)+'</div>';
  h+='<div class="rbox"><i>'+(inv?'Invoice No.':'Receipt No.')+'</i><b>'+esc(o.no)+'</b></div>';
  h+=row('Status',o.st||(inv?'Awaiting payment':'Paid in full'));
  if(inv&&o.due)h+=row('Pay by',o.due);
  h+='<hr class="sp">'+row('Customer',o.cust||'Walk-in');
  if(o.phone)h+=row('Phone',o.phone);
  h+='<hr class="sp">';
  (o.items||[]).forEach(function(i){h+=row(i[0],n2(i[1]*i[2]));if(i[1]!==1)h+=row(i[1]+' x '+n2(i[2]),'',' sub')});
  h+='<hr class="sp">';
  if(o.disc>0){h+=row('Subtotal',n2(o.total+o.disc)+' JMD');h+=row('Discount','-'+n2(o.disc)+' JMD')}
  h+=row('Total',n2(o.total)+' JMD',' big red');
  if(o.paid>0)h+=row('Paid ('+(o.method||'Cash')+')',n2(o.paid)+' JMD',' green');
  if(o.bal>0.004)h+=row('Balance due',n2(o.bal)+' JMD',' big red');
  h+='<hr class="sp">';
  if(inv&&o.pay){h+=row('How to pay','');String(o.pay).split(/\n+/).forEach(function(x){if(x.trim())h+='<div class="rw"><span>'+esc(x.trim())+'</span></div>'});h+='<hr class="sp">'}
  h+=row('Served by','Ash');
  h+='<div class="brand">'+esc(o.biz||'Printastic JA')+'</div>';
  if(o.ft)h+='<div class="ft">'+esc(o.ft)+'</div>';
  if(o.ig)h+='<div class="ft gap">Instagram @'+esc(o.ig)+'</div>';
  if(o.tt)h+='<div class="ft">TikTok @'+esc(o.tt)+'</div>';
  h+='</div>';
  document.getElementById('out').innerHTML=h;
  document.title=(inv?'Invoice ':'Receipt ')+o.no+' - '+(o.biz||'Printastic JA');
  document.getElementById('bar').hidden=false;
}
function fail(){document.getElementById('out').innerHTML='<div class="err"><b>This link looks incomplete.</b><br>Please ask Printastic JA to send it again.</div>'}
(async function(){
  if(!location.hash||location.hash.length<5){fail();return}
  try{render(await decode(location.hash))}catch(e){fail()}
})();
function doPrint(){try{window.print()}catch(e){}document.getElementById('hint').hidden=false}
document.getElementById('pdf').onclick=doPrint;
document.getElementById('prt').onclick=doPrint;
</script>
