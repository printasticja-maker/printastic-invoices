<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Printastic JA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--ink:#14141a;--mut:#7a7a86;--line:#ececf1;--mag:#e6007e;--cyan:#00a7e1;--yel:#ffd400;--ok:#0f9d58;--bad:#d93025;--warn:#b26a00}
body{margin:0;background:#f4f4f8;color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
.page{max-width:440px;margin:0 auto;padding:18px 14px 44px}
.bar{display:flex;gap:10px;margin:0 0 14px}
.bar button{flex:1;font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 10px;cursor:pointer;background:var(--ink);color:#fff}
.bar button.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #dcdce4}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(20,20,40,.08);overflow:hidden}
.stripe{height:6px;background:linear-gradient(90deg,var(--mag),var(--yel) 50%,var(--cyan))}
.hd{padding:22px 22px 4px}
.hd .top{display:flex;justify-content:center;padding:4px 0 16px}
.hd .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.lg{width:230px;max-width:80%;height:auto;display:block;mix-blend-mode:multiply}
.ttl{text-align:left}
.pillbox{text-align:right}
.ttl small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.ttl b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.pill{display:inline-block;margin-bottom:3px;padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.pill.paid{background:#e3f6ec;color:var(--ok)}.pill.due{background:#fff1d6;color:var(--warn)}.pill.od{background:#fde6e4;color:var(--bad)}.pill.qt{background:#e1f3fb;color:#0877a6}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 22px 18px}
.meta div small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.meta div b{font-weight:600;font-size:13.5px;word-break:break-word}
.meta .r{text-align:right}
.items{margin:0 22px;border-top:1px solid var(--line)}
.it{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.it .d b{display:block;font-weight:600}
.it .d span{font-size:12px;color:var(--mut)}
.it .a{font-weight:700;white-space:nowrap}
.sum{margin:16px 22px 0;background:#f7f7fb;border-radius:16px;padding:12px 16px}
.sr{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--mut)}
.sr b{font-weight:600;color:var(--ink);white-space:nowrap}
.sr.ok b,.sr.ok{color:var(--ok)}
.sr.tot{border-top:1px dashed #d4d4de;margin-top:6px;padding-top:11px;color:var(--ink);font-weight:700;font-size:16px}
.sr.tot b{font-weight:800;font-size:18px}
.sr.bal{color:var(--bad);font-weight:700;font-size:15px}.sr.bal b{color:var(--bad);font-weight:800}
.pay{margin:16px 22px 0;border:1.5px solid var(--ink);border-radius:16px;padding:14px 16px}
.pay small,.sec small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.pay div{padding:2px 0;font-weight:600;font-size:13px}
.cta{margin:16px 22px 0;padding:12px 16px;border-radius:14px;background:#e1f3fb;color:#0877a6;font-weight:600;font-size:13px}
.ft2{padding:22px 22px 24px;text-align:center}
.ft2 .tn{font-weight:700;font-size:15px;margin-bottom:4px}
.ft2 p{margin:0 0 12px;color:var(--mut);font-size:12px}
.soc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.soc span{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:#f2f2f7}
.sm{text-align:center;color:var(--mut);font-size:11.5px;margin-top:12px}
.err{background:#fff;border-radius:18px;padding:24px;text-align:center}
.note{text-align:center;color:#777;font-size:12.5px;margin-top:22px}
@media print{
  @page{margin:10mm}
  body{background:#fff}
  .bar,.note{display:none}
  .page{max-width:none;padding:0}
  .card{box-shadow:none;max-width:440px;margin:0 auto;break-inside:avoid;page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="page">
  <div class="bar" id="bar" hidden>
    <button id="pdf">Download PDF</button>
    <button class="alt" id="prt">Print</button>
  </div>
  <div id="out"></div>
  <p class="note" id="hint" hidden>Tip: in the window that opens, choose “Save as PDF”.</p>
</div>

function fmtPhone(p){var d=String(p||'').replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);return d.length===10?'('+d.slice(0,3)+')'+d.slice(3,6)+'-'+d.slice(6):String(p||'')}
function longDate(iso,hm){var d=new Date(iso+'T00:00:00');if(isNaN(d))return iso||'';var o=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});if(hm&&hm.length===4){var h=+hm.slice(0,2),m=hm.slice(2),ap=h>=12?'PM':'AM';h=h%12||12;o+=' \u00b7 '+h+':'+m+' '+ap}return o}
function shortDate(iso){var d=new Date(iso+'T00:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function expand(a){
  if(!Array.isArray(a))return a;
  if(a[1]===3)return {k:'pl',dt:'Updated '+shortDate(a[2]),items:a[7]||[],note:a[5]||'',biz:CFG.biz,wa:CFG.wa,ig:CFG.ig,tt:CFG.tt,ft:CFG.ft};
  var items=a[7]||[],disc=+a[8]||0,paid=+a[9]||0,sub=0;items.forEach(function(i){sub+=i[1]*i[2]});
  var total=Math.max(0,sub-disc),bal=total-paid,q=a[1]===2,inv=a[1]===1&&bal>0.004,od=inv&&a[4]&&a[4]<new Date().toISOString().slice(0,10);
  return {k:q?'q':inv?'inv':'rcpt',no:'PJ-'+String(a[0]).padStart(4,'0'),dt:longDate(a[2],a[3]),st:q?'Quote, not yet confirmed':inv?(od?'Overdue':'Awaiting payment'):'Paid in full',due:(inv||q)&&a[4]?shortDate(a[4]):'',cust:a[5],phone:fmtPhone(a[6]),items:items,disc:disc,total:total,paid:paid,method:a[10],bal:(!q&&bal>0.004)?bal:0,pay:inv?CFG.pay:'',biz:CFG.biz,wa:CFG.wa,ig:CFG.ig,tt:CFG.tt,ft:CFG.ft}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function n2(n){return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fromB64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decode(h){
  h=(h||'').replace(/^#/,'');
  if(/^[A-Za-z0-9]{8,40}$/.test(h)&&h.slice(1,2)!=='.'){
    var r=await fetch(SB.url+'/rest/v1/rpc/get_doc',{method:'POST',headers:{'apikey':SB.key,'Content-Type':'application/json'},body:JSON.stringify({p_id:h}),cache:'no-store'});
    if(!r.ok)throw new Error('net');
    var d=await r.json();if(!d)throw new Error('none');
    return expand(d);
  }
  var kind=h.slice(0,2),body=h.slice(2),bytes=fromB64u(body);
  if(kind==='z.'){
    var ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(bytes);w.close();
    bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }else if(kind!=='j.')throw new Error('bad');
  return expand(JSON.parse(new TextDecoder().decode(bytes)));
}
function head(o,label,no,pill,cls){return '<div class="card"><div class="stripe"></div><div class="hd"><div class="top"><img class="lg" alt="Printastic JA" src="'+LOGO+'"></div><div class="row"><div class="ttl"><small>'+esc(label)+'</small><b>'+esc(no)+'</b></div>'+(pill?'<div class="pillbox"><span class="pill '+cls+'">'+esc(pill)+'</span></div>':'')+'</div></div>'}
function foot(o){
  var h='<div class="ft2"><div class="tn">'+esc(o.biz||'Printastic JA')+'</div>';
  if(o.ft)h+='<p>'+esc(o.ft)+'</p>';
  h+='<div class="soc">';
  if(o.wa)h+='<span>WhatsApp '+esc(o.wa)+'</span>';
  if(o.ig)h+='<span>IG @'+esc(o.ig)+'</span>';
  if(o.tt)h+='<span>TikTok @'+esc(o.tt)+'</span>';
  return h+'</div></div></div>'
}
function renderPL(o){
  var h=head(o,'Price list',o.biz||'Printastic JA','','');
  h+='<div class="meta"><div><small>Updated</small><b>'+esc(String(o.dt).replace('Updated ',''))+'</b></div><div class="r"><small>Order</small><b>WhatsApp us</b></div></div><div class="items">';
  (o.items||[]).forEach(function(i){h+='<div class="it"><div class="d"><b>'+esc(i[0])+'</b></div><div class="a">J$'+n2(i[1])+'</div></div>'});
  h+='</div>';
  if(o.note)h+='<div class="cta">'+esc(o.note)+'</div>';
  h+='<div class="cta">To order, message us on WhatsApp'+(o.wa?' '+esc(o.wa):'')+'</div>'+foot(o);
  document.getElementById('out').innerHTML=h;document.title='Price list - '+(o.biz||'Printastic JA');document.getElementById('bar').hidden=false;
}
function render(o){
  if(o.k==='pl')return renderPL(o);
  var inv=o.k==='inv',q=o.k==='q';
  var cls=q?'qt':inv?(o.st==='Overdue'?'od':'due'):'paid';
  var h=head(o,q?'Quote':inv?'Invoice':'Receipt',o.no,o.st||(inv?'Awaiting payment':'Paid in full'),cls);
  h+='<div class="meta"><div><small>Billed to</small><b>'+esc(o.cust||'Walk-in')+'</b>'+(o.phone?'<div style="font-size:12px;color:var(--mut);margin-top:1px">'+esc(o.phone)+'</div>':'')+'</div><div class="r"><small>Date</small><b>'+esc(String(o.dt).split(' · ')[0])+'</b><div style="font-size:12px;color:var(--mut);margin-top:1px">'+esc(String(o.dt).split(' · ')[1]||'')+'</div>'+((inv||q)&&o.due?'<div style="font-size:12px;color:var(--mut);margin-top:3px">'+(q?'Valid until ':'Pay by ')+esc(o.due)+'</div>':'')+'</div></div>';
  h+='<div class="items">';
  (o.items||[]).forEach(function(i){h+='<div class="it"><div class="d"><b>'+esc(i[0])+'</b>'+(i[1]!==1?'<span>'+i[1]+' x J$'+n2(i[2])+'</span>':'')+'</div><div class="a">J$'+n2(i[1]*i[2])+'</div></div>'});
  h+='</div><div class="sum">';
  if(o.disc>0){h+='<div class="sr"><span>Subtotal</span><b>J$'+n2(o.total+o.disc)+'</b></div><div class="sr"><span>Discount</span><b>-J$'+n2(o.disc)+'</b></div>'}
  h+='<div class="sr tot"><span>Total</span><b>J$'+n2(o.total)+'</b></div>';
  if(o.paid>0)h+='<div class="sr ok"><span>Paid ('+esc(o.method||'Cash')+')</span><b>J$'+n2(o.paid)+'</b></div>';
  if(o.bal>0.004)h+='<div class="sr bal"><span>Balance due</span><b>J$'+n2(o.bal)+'</b></div>';
  h+='</div>';
  if(q)h+='<div class="cta">To go ahead, message us on WhatsApp'+(o.wa?' '+esc(o.wa):'')+'</div>';
  if(inv&&o.pay){h+='<div class="pay"><small>How to pay</small>';String(o.pay).split(/\n+/).forEach(function(x){if(x.trim())h+='<div>'+esc(x.trim())+'</div>'});h+='</div>'}
  h+=foot(o);
  document.getElementById('out').innerHTML=h;
  document.title=(q?'Quote ':inv?'Invoice ':'Receipt ')+o.no+' - '+(o.biz||'Printastic JA');
  document.getElementById('bar').hidden=false;
}
function fail(){document.getElementById('out').innerHTML='<div class="err"><b>This link looks incomplete.</b><br>Please ask Printastic JA to send it again.</div>'}
var lastJson='';
async function load(first){
  if(!location.hash||location.hash.length<5){if(first)fail();return}
  try{var o=await decode(location.hash),j=JSON.stringify(o);if(j!==lastJson){lastJson=j;render(o)}}catch(e){if(first)fail()}
}
load(true);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load(false)});
setInterval(function(){if(!document.hidden&&/^#[A-Za-z0-9]{8,40}$/.test(location.hash))load(false)},30000);
function doPrint(){try{window.print()}catch(e){}document.getElementById('hint').hidden=false}
document.getElementById('pdf').onclick=doPrint;
document.getElementById('prt').onclick=doPrint;
</script>
</body>
